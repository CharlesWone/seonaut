#   =============================================
# CONTEXT: Issue types.
#   =============================================
ERROR_50x: 返回 50x 状态码的 URL
ERROR_50x_DESC: 通常由服务器错误或配置问题导致，受影响页面无法正常加载，会吓跑用户并惹恼搜索引擎。
ERROR_40x: 返回 40x 状态码的 URL
ERROR_40x_DESC: 这些页面丢失了，用户和搜索引擎都会迷路。大量 404 会让搜索引擎认为网站维护不佳，影响抓取效率和权威性。
ERROR_30x: 返回 30x 状态码的 URL
ERROR_30x_DESC: 重定向会把用户和搜索引擎引导到别的页面。重定向会拖慢加载速度、迷惑用户并浪费爬虫预算。
ERROR_REDIRECT_CHAIN: 存在重定向链的 URL
ERROR_REDIRECT_CHAIN_DESC: 重定向链是指多个连续重定向。会让用户沮丧，也让搜索引擎难以高效抓取和索引内容。
ERROR_REDIRECT_LOOP: 存在重定向循环的 URL
ERROR_REDIRECT_LOOP_DESC: 两个 URL 互相重定向形成死循环。会阻止用户和搜索引擎到达最终页面，破坏用户体验并阻止正常抓取索引。
ERROR_DUPLICATED_TITLE: 标题重复的页面
ERROR_DUPLICATED_TITLE_DESC: 标题是页面 SEO 最重要的元素之一，重复标题会导致页面在相同关键词上互相竞争，迷惑搜索引擎。
ERROR_LONG_TITLE: 标题过长的页面
ERROR_LONG_TITLE_DESC: 过长标题不影响 SEO，但会在搜索结果中被截断，通常点击率更低。
ERROR_SHORT_TITLE: 标题过短的页面
ERROR_SHORT_TITLE_DESC: 标题太短。搜索引擎更喜欢较长的描述性标题。
ERROR_EMPTY_TITLE: 缺少标题的页面
ERROR_EMPTY_TITLE_DESC: 标题帮助搜索引擎理解页面内容，也常显示在搜索结果中。没有标题会降低排名、显得不专业。
ERROR_EMPTY_DESCRIPTION: 缺少 meta description 的页面
ERROR_EMPTY_DESCRIPTION_DESC: 描述不是排名因素，但搜索引擎常用来展示搜索结果片段。
ERROR_SHORT_DESCRIPTION: meta description 过短的页面
ERROR_SHORT_DESCRIPTION_DESC: 过短的描述会让搜索引擎自行生成片段，通常效果更差。
ERROR_LONG_DESCRIPTION: meta description 过长的页面
ERROR_LONG_DESCRIPTION_DESC: 过长描述会被截断，影响搜索结果吸引力。
ERROR_DUPLICATED_DESCRIPTION: meta description 重复的页面
ERROR_DUPLICATED_DESCRIPTION_DESC: 建议每个页面使用唯一的描述，帮助搜索引擎更好理解页面。
ERROR_LITTLE_CONTENT: 内容过少的页面
ERROR_LITTLE_CONTENT_DESC: 内容很少的页面对用户和搜索引擎都没有价值，建议补充内容。
ERROR_IMAGES_NO_ALT: 图片缺少 Alt 属性的页面
ERROR_IMAGES_NO_ALT_DESC: Alt 属性提升可访问性，也帮助搜索引擎理解图片。
ERROR_NO_H1: 缺少 H1 标题的页面
ERROR_NO_H1_DESC: H1 描述页面主要主题，缺少它会让用户和搜索引擎难以判断页面讲什么。
ERROR_NO_LANG: 缺少语言属性的页面
ERROR_NO_LANG_DESC: lang 属性对屏幕阅读器很有用，部分搜索引擎也会参考，但不直接影响排名。
ERROR_HTTP_LINKS: HTTPS 页面包含 HTTP 链接
ERROR_HTTP_LINKS_DESC: 从安全页面链接到不安全页面。全站 HTTPS 有助于排名和用户信任。
ERROR_HREFLANG_RETURN: 缺少回指 hreflang 的页面
ERROR_HREFLANG_RETURN_DESC: hreflang 必须双向引用，否则搜索引擎可能忽略。
ERROR_TOO_MANY_LINKS: 链接过多的页面
ERROR_TOO_MANY_LINKS_DESC: 页面链接太多会稀释每个链接传递的权重。确保链接相关，或对不重要的使用 nofollow。
ERROR_INTERNAL_NOFOLLOW: 内部 nofollow 链接
ERROR_INTERNAL_NOFOLLOW_DESC: 内部链接一般不应使用 nofollow，除非你不想让搜索引擎索引目标页面。
ERROR_EXTERNAL_WITHOUT_NOFOLLOW: 外部 follow 链接
ERROR_EXTERNAL_WITHOUT_NOFOLLOW_DESC: follow 外部链接会传递权重到别的网站，需注意评论区等用户生成内容。
ERROR_CANONICALIZED_NON_CANONICAL: 规范指向非规范页面
ERROR_CANONICALIZED_NON_CANONICAL_DESC: canonical 应指向规范页面，否则会导致索引混乱。
ERROR_NOT_VALID_HEADINGS: 标题层级不正确的页面
ERROR_NOT_VALID_HEADINGS_DESC: 标题应从 H1 开始并保持清晰层级，有助于搜索引擎理解内容和提升可访问性。
ERROR_HREFLANG_TO_NON_CANONICAL: hreflang 指向非规范页面
ERROR_HREFLANG_TO_NON_CANONICAL_DESC: hreflang 应指向规范版本，否则会迷惑搜索引擎。
ERROR_NOFOLLOW_INDEXABLE: nofollow 链接指向可索引页面
ERROR_NOFOLLOW_INDEXABLE_DESC: nofollow 应配合 noindex 使用，否则搜索引擎仍可能索引目标页面。
ERROR_NO_INDEXABLE: 不可索引页面
ERROR_NO_INDEXABLE_DESC: 使用 noindex 的页面不会被搜索引擎收录，通常用于不重要的页面，请检查是否误设。
ERROR_HREFLANG_NO_INDEXABLE: hreflang 指向不可索引页面
ERROR_HREFLANG_NO_INDEXABLE_DESC: hreflang 应指向可索引页面，否则会造成混淆。
ERROR_BLOCKED: 被 robots.txt 阻止的 URL
ERROR_BLOCKED_DESC: 被 robots.txt 阻止的页面不会被搜索引擎抓取，请确保重要页面未被误拦。
ERROR_ORPHAN: 孤儿页面
ERROR_ORPHAN_DESC: 站点内没有任何链接指向的页面，用户无法访问，也浪费爬虫资源。
NO_INDEX_IN_SITEMAP: 不可索引页面出现在 sitemap 中
NO_INDEX_IN_SITEMAP_DESC: 不可索引页面不应出现在 sitemap 中，会发送矛盾信号。
BLOCKED_IN_SITEMAP: 被阻止页面出现在 sitemap 中
BLOCKED_IN_SITEMAP_DESC: 被 robots.txt 阻止的页面不应出现在 sitemap 中，会发送矛盾信号。
NON_CANONICAL_IN_SITEMAP: 非规范页面出现在 sitemap 中
NON_CANONICAL_IN_SITEMAP_DESC: 非规范页面不应出现在 sitemap 中，会误导搜索引擎。
INCOMING_FOLLOW_NOFOLLOW: 同时存在 follow 和 nofollow 入链的页面
INCOMING_FOLLOW_NOFOLLOW_DESC: 同时存在两种入链会稀释权重信号，迷惑搜索引擎。
INVALID_LANG: lang 属性无效的页面
INVALID_LANG_DESC: 无效的 lang 属性会影响搜索引擎识别语言和屏幕阅读器。
HTTP_SCHEME: 使用 HTTP 协议的页面
HTTP_SCHEME_DESC: 使用 HTTP 而非 HTTPS，会影响安全性和排名。
DEAD_END: 死胡同页面（无出口链接）
DEAD_END_DESC: 没有任何链接指向其他页面的页面，会影响用户和爬虫继续浏览。
ERROR_CANONICALIZED_NON_INDEXABLE: 规范指向不可索引页面
ERROR_CANONICALIZED_NON_INDEXABLE_DESC: 这会让搜索引擎认为不可索引页面是首选版本，导致内容无法被发现。
ERROR_HREFLANG_REDIRECT: hreflang 指向重定向页面
ERROR_HREFLANG_REDIRECT_DESC: hreflang 指向 30x 重定向会让搜索引擎困惑。
ERROR_CANONICAL_REDIRECT: canonical 指向重定向
ERROR_CANONICAL_REDIRECT_DESC: canonical 应指向最终页面，而不是重定向中间页。
ERROR_HREFLANG_ERROR: hreflang 指向错误页面
ERROR_HREFLANG_ERROR_DESC: hreflang 指向 40x/50x 错误页面，会影响多语言版本索引。
ERROR_CANONICAL_ERROR: canonical 指向错误页面
ERROR_CANONICAL_ERROR_DESC: canonical 指向 40x/50x 错误页面，搜索引擎无法抓取首选版本。
ERROR_MULTIPLE_CANONICAL_TAGS: 多个 canonical 标签
ERROR_MULTIPLE_CANONICAL_TAGS_DESC: 一个页面只能有一个 canonical，否则搜索引擎会困惑。
ERROR_RELATIVE_CANONICAL_URL: canonical 使用相对路径
ERROR_RELATIVE_CANONICAL_URL_DESC: 建议使用绝对路径，避免长期问题。
ERROR_HREFLANG_XDEFAULT: 缺少 x-default hreflang
ERROR_HREFLANG_XDEFAULT_DESC: 缺少 x-default 会导致不匹配语言的用户显示错误版本。
ERROR_HREFLANG_SELF_REFERENCE: 缺少自引用 hreflang
ERROR_HREFLANG_SELF_REFERENCE_DESC: 必须包含当前页面自身的 hreflang 自引用。
ERROR_HREFLANG_MISMATCHING_LANG: hreflang 与 lang 属性不匹配
ERROR_HREFLANG_MISMATCHING_LANG_DESC: 两者不一致会迷惑搜索引擎。
ERROR_HREFLANG_RELATIVE_URL: hreflang 使用相对路径
ERROR_HREFLANG_RELATIVE_URL_DESC: hreflang 必须使用绝对路径。
ERROR_CANONICAL_MISMATCH: HTML 与 HTTP 头中的 canonical 不一致
ERROR_CANONICAL_MISMATCH_DESC: 不一致会导致搜索引擎困惑，影响排名。
ERROR_MISSING_HSTS: 缺少 HSTS 头
ERROR_MISSING_HSTS_DESC: 缺少 HSTS 会降低安全性，可能影响 SEO。
ERROR_MISSING_CSP: 缺少内容安全策略
ERROR_MISSING_CSP_DESC: 缺少 CSP 增加安全风险，搜索引擎可能降权。
ERROR_CONTENT_TYPE_OPTIONS: 缺少 X-Content-Type-Options 头
ERROR_CONTENT_TYPE_OPTIONS_DESC: 缺少此头会带来内容类型安全风险。
ERROR_LARGE_IMAGE: 大尺寸图片
ERROR_LARGE_IMAGE_DESC: 大图会拖慢页面加载，影响用户体验和 SEO。
ERROR_LONG_ALT_TEXT: Alt 文本过长的图片
ERROR_LONG_ALT_TEXT_DESC: Alt 文本应简洁明了，过长反而降低可读性。
ERROR_MULTIPLE_TITLES: 多个 title 标签
ERROR_MULTIPLE_TITLES_DESC: 一个页面只能有一个 title，否则搜索引擎会困惑。
ERROR_MULTIPLE_DESCRIPTIONS: 多个 description meta 标签
ERROR_MULTIPLE_DESCRIPTIONS_DESC: 同上，只能有一个。
ERROR_PAGE_DEPTH: 深度过高的页面
ERROR_PAGE_DEPTH_DESC: 深度过高难以被用户和搜索引擎发现。
ERROR_MULTIPLE_LANG_REFERENCE: hreflang 中引用了多个语言
ERROR_MULTIPLE_LANG_REFERENCE_DESC: 会导致搜索引擎错误识别语言。
ERROR_DUPLICATED_CONTENT: 内容完全重复的页面
ERROR_DUPLICATED_CONTENT_DESC: 会稀释排名、浪费爬虫预算。
ERROR_EXTERNAL_LINK_REDIRECT: 外部链接指向重定向
ERROR_EXTERNAL_LINK_REDIRECT_DESC: 不影响自身排名，但影响用户体验，建议替换为最终地址。
ERROR_EXTERNAL_LINK_BROKEN: 外部失效链接
ERROR_EXTERNAL_LINK_BROKEN_DESC: 会让用户沮丧，建议修复或删除。
ERROR_TIMEOUT: 抓取超时
ERROR_TIMEOUT_DESC: 搜索引擎也可能无法访问，建议检查服务器性能。
ERROR_UNDERSCORE_URL: URL 中含下划线
ERROR_UNDERSCORE_URL_DESC: 部分搜索引擎会把下划线当作连接符，建议改用短横线。
ERROR_SLOW_TTFB: 首字节时间过慢
ERROR_SLOW_TTFB_DESC: 会拖慢整体加载，影响核心网页指标和排名。
ERROR_HTTP_FORM: HTTP 页面上的表单
ERROR_HTTP_FORM_DESC: 不安全，会触发浏览器警告，影响信任和排名。
ERROR_INSECURE_FORM: 表单 action 为 HTTP
ERROR_INSECURE_FORM_DESC: 数据易被拦截，影响安全和 SEO。
ERROR_SPACE_URL: URL 中含空格
ERROR_SPACE_URL_DESC: 会导致链接失效，建议用短横线代替。
ERROR_MULTIPLE_SLASHES: 路径中多个连续斜杠
ERROR_MULTIPLE_SLASHES_DESC: 显得不专业，可能导致索引问题。
ERROR_NOIMAGEINDEX: 使用 noimageindex 的页面
ERROR_NOIMAGEINDEX_DESC: 会阻止图片被搜索引擎收录，请确认是否必要。
ERROR_PICTURE_MISSONG_IMG: picture 标签缺少 img 元素
ERROR_PICTURE_MISSONG_IMG_DESC: 会导致图片无法显示，也影响图片索引。
ERROR_METAS_IN_BODY: meta 标签放在 body 中
ERROR_METAS_IN_BODY_DESC: 必须放在 head 中，否则会被忽略。
ERROR_NOSNIPPET: 使用 nosnippet 或 max-snippet:0
ERROR_NOSNIPPET_DESC: 会阻止搜索结果显示文字/视频片段，请确认是否需要。
ERROR_IMG_SIZE_ATTR: 图片缺少宽度高度属性
ERROR_IMG_SIZE_ATTR_DESC: 会导致布局偏移（CLS），影响核心网页指标。
ERROR_INCORRECT_MEDIA_TYPE: MIME 类型错误
ERROR_INCORRECT_MEDIA_TYPE_DESC: 浏览器可能无法正确渲染，影响体验和索引。
ERROR_DUPLICATED_ID: 重复的 ID 属性
ERROR_DUPLICATED_ID_DESC: 会干扰 JavaScript 和辅助技术，影响可访问性。
ERROR_MISSING_VIEWPORT: 缺少 viewport meta 标签
ERROR_MISSING_VIEWPORT_DESC: 移动端显示异常，严重影响移动搜索排名。
ERROR_DOM_SIZE: DOM 节点过多
ERROR_DOM_SIZE_DESC: 会拖慢加载和渲染，建议精简结构。
ERROR_PAGINATION_LINKS: rel="next/prev" 未在页面正文链接
ERROR_PAGINATION_LINKS_DESC: 会让搜索引擎困惑分页关系。
ERROR_LOCALHOST_LINKS: 链接指向 localhost 或 127.0.0.1
ERROR_LOCALHOST_LINKS_DESC: 外部用户无法访问，会造成错误，建议替换为正式地址。